name: Pruebas de API

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Instalar PyTorch para CPU
        run: |
          python -m pip install "torch==2.15.0+cpu" --index-url https://download.pytorch.org/whl/cpu

      - name: Instalar dependencias de pruebas
        run: python -m pip install -r requirements-ci.txt

      - name: Comprobar dependencias
        run: python -m pip check

      - name: Ejecutar pruebas automatizadas
        run: python -m unittest -v test_validaciones